name: Build, Release & Docker

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-server:
    name: Build & Package Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MediaViewer.Server/MediaViewer.Server.csproj

      - name: Build Server
        run: dotnet build src/MediaViewer.Server/MediaViewer.Server.csproj -c Release --no-restore

      - name: Publish Server (Linux x64)
        run: |
          dotnet publish src/MediaViewer.Server/MediaViewer.Server.csproj -c Release -r linux-x64 --self-contained true -o ./artifacts/server-linux-x64
          cd ./artifacts/server-linux-x64 && zip -r ../mediaviewer-server-linux-x64.zip . && cd ../..

      - name: Publish Server (Windows x64)
        run: |
          dotnet publish src/MediaViewer.Server/MediaViewer.Server.csproj -c Release -r win-x64 --self-contained true -o ./artifacts/server-win-x64
          cd ./artifacts/server-win-x64 && zip -r ../mediaviewer-server-win-x64.zip . && cd ../..

      - name: Upload Server Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: |
            ./artifacts/*.zip

  build-android:
    name: Build Android App (APK/AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      - name: Restore App dependencies
        run: dotnet restore src/MediaViewer.App/MediaViewer.App.csproj

      - name: Build & Publish Android APK / AAB
        run: |
          dotnet publish src/MediaViewer.App/MediaViewer.App.csproj -f net10.0-android -c Release -p:AndroidKeyStore=false -o ./artifacts/android

      - name: Collect Android packages
        id: collect-apk
        run: |
          mkdir -p ./artifacts/release-apk
          find ./artifacts/android -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} ./artifacts/release-apk/ \;

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: ./artifacts/release-apk/*

  docker-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-server, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Server Artifacts
        uses: actions/download-artifact@v4
        with:
          name: server-binaries
          path: ./release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-app
          path: ./release-assets

      - name: Prepare Release Tag & Title
        id: vars
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=Release ${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
