<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>MediaViewer.App</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="MediaViewer.App.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        window.mvTrackProgress = function (id, dotNetRef) {
            const v = document.getElementById(id);
            if (!v) return;
            const report = () => {
                if (v.duration && !isNaN(v.duration))
                    dotNetRef.invokeMethodAsync('OnProgressAsync', v.currentTime, v.duration);
            };
            v._mvTimer = setInterval(report, 10000);
            v.addEventListener('pause', report);
            v.addEventListener('ended', report);
        };
        window.mvUntrackProgress = function (id) {
            const v = document.getElementById(id);
            if (v && v._mvTimer) clearInterval(v._mvTimer);
        };
        window.mvGetProgress = function (id) {
            const v = document.getElementById(id);
            if (!v) return [0, 0];
            return [v.currentTime || 0, v.duration || 0];
        };
    </script>

</body>

</html>
