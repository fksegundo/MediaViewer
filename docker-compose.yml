services:
  server:
    build: .
    ports:
      - "5080:8080"
    environment:
      # Troque a senha antes de expor na internet
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:-admin}
      # Chaves de API (opcionais, mas necessárias para busca TMDB e feed YouTube)
      Tmdb__ApiKey: ${TMDB_API_KEY:-}
      YouTube__ApiKey: ${YOUTUBE_API_KEY:-}
      YouTube__RefreshHours: ${YOUTUBE_REFRESH_HOURS:-6}
    volumes:
      - server-data:/data
    restart: unless-stopped

volumes:
  server-data:
